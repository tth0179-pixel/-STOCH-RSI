name: Update KOSPI Stoch RSI Data

on:
  schedule:
    # 매 평일 09:00~20:00(KST) 20분마다 -> UTC 00:00~11:00, 20분 간격
    # 정각/20분/40분 정각은 전세계 스케줄 작업이 몰려 GitHub에서 이벤트가 지연/드롭되기 쉬워
    # 03,23,43분으로 살짝 밀어서 등록 (지연·드롭 빈도를 줄이기 위함)
    - cron: "3,23,43 0-10 * * 1-5"
    - cron: "3 11 * * 1-5"
  workflow_dispatch: {}

# 자동 스케줄 실행과 수동 실행이 겹치면 같은 data.json에 동시에 git push하다 충돌/실패할 수 있어,
# 새 실행이 시작되면 이미 돌고 있는 실행을 취소하고 하나만 돌도록 강제한다.
concurrency:
  group: update-kospi-data
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and calculate Stoch RSI
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json top30_codes.json
          git diff --staged --quiet || git commit -m "Update KOSPI Stoch RSI data ($(date +'%Y-%m-%d %H:%M'))"
          git push
