on:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST
  workflow_dispatch:        # 수동 실행 가능

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs older than 3 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RETAIN_DAYS: 3
        run: |
          CUTOFF=$(date -u -d "${RETAIN_DAYS} days ago" +%Y-%m-%dT%H:%M:%SZ)
          echo "Cutoff: $CUTOFF"
          for i in 1 2 3 4 5; do
            IDS=$(gh run list --limit 1000 --json databaseId,createdAt \
              --jq ".[] | select(.createdAt < \"$CUTOFF\") | .databaseId")
            [ -z "$IDS" ] && break
            echo "$IDS" | xargs -r -P 4 -I{} gh run delete {}
          done
