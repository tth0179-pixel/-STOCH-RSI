name: Update BTC Stoch RSI Data

on:
  schedule:
    # 매일(주말 포함) 20분마다 -> 24시간 365일
    # 정각/20분/40분 정각은 전세계 스케줄 작업이 몰려 GitHub에서 이벤트가 지연/드롭되기 쉬워
    # 03,23,43분으로 살짝 밀어서 등록 (지연·드롭 빈도를 줄이기 위함)
    - cron: "3,23,43 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-btc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-btc.txt

      - name: Fetch BTC data and calculate Stoch RSI
        run: python fetch_btc.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc.json
          git diff --staged --quiet || git commit -m "Update BTC Stoch RSI data ($(date +'%Y-%m-%d %H:%M'))"
          git push
