name: Update BTC Stoch RSI Data

on:
  schedule:
    # 매일(주말 포함) 20분마다 -> 24시간 365일
    # 코스피 워크플로우(3,23,43분)와 같은 시각에 돌면 같은 브랜치에 동시에 push하다 충돌하므로 10분 엇갈리게 13,33,53분에 실행
    - cron: "13,33,53 * * * *"
  workflow_dispatch: {}

concurrency:
  group: update-btc-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-btc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-btc.txt

      - name: Fetch BTC data and calculate Stoch RSI
        run: python fetch_btc.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc.json
          git diff --staged --quiet || git commit -m "Update BTC Stoch RSI data ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST)"
          # 코스피 워크플로우가 그사이 먼저 push했으면 거부되므로, 최신 상태를 받아 위에 얹은 뒤 다시 push (최대 5회)
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "push 실패 - 재시도 $i/5"
            sleep $((i * 5))
          done
          exit 1
