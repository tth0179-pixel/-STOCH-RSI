name: Update BTC Stoch RSI Data

on:
  schedule:
    # 매일(주말 포함) 20분마다 -> 24시간 365일
    - cron: "0,20,40 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-btc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-btc.txt

      - name: Fetch BTC data and calculate Stoch RSI
        run: python fetch_btc.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add btc.json
          git diff --staged --quiet || git commit -m "Update BTC Stoch RSI data ($(date +'%Y-%m-%d %H:%M'))"
          git push
