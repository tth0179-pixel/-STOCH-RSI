name: Update KOSPI Stoch RSI Data

on:
  schedule:
    # 매 평일 UTC 07:30 = KST 16:30 (장마감 후)
    - cron: "30 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data and calculate Stoch RSI
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json top30_codes.json
          git diff --staged --quiet || git commit -m "Update KOSPI Stoch RSI data ($(date +'%Y-%m-%d %H:%M'))"
          git push
